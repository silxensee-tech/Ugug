<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iQOO CLICKER</title>
  <style>
    :root {
      --primary: #f08b18;
      --primary-glow: rgba(240, 139, 24, 0.4);
      --bg: #edf0f5;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: #d4dbe6;
      --text: #1b212d;
      --text-muted: #626c7e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 20px 15px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 30px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      gap: 25px;
      width: 100%;
      max-width: 1100px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        max-width: 450px;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(8px);
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .btn-upgrade {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .btn-upgrade:hover:not(:disabled) {
      background: #ffffff;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .btn-upgrade:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stat-row {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .note {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 15px;
      line-height: 1.3;
    }

    .click-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      padding: 8px;
      background: linear-gradient(135deg, var(--primary), #ffe6b0);
      box-shadow: 0 0 40px var(--primary-glow);
      cursor: pointer;
      transition: transform 0.08s ease;
      touch-action: manipulation;
    }

    .avatar-wrapper:active {
      transform: scale(0.94);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      pointer-events: none;
    }

    .floating-text {
      position: absolute;
      font-weight: 900;
      font-size: 1.6rem;
      color: var(--primary);
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
    }

    .score-display {
      margin-top: 25px;
      text-align: center;
    }

    .score-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .sub-score {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>iQOO CLICKER — Локальная Версия (Без БД)</header>

  <main class="container">
    <div class="panel">
      <div class="panel-title">Локальные улучшения</div>
      <button class="btn-upgrade" id="btn-click-upgrade">
        <span>+1 к клику</span>
        <strong id="cost-click">10</strong>
      </button>
      <button class="btn-upgrade" id="btn-auto-upgrade">
        <span>Авто-кликер (в сек)</span>
        <strong id="cost-auto">50</strong>
      </button>
      <button class="btn-upgrade" id="btn-boost">
        <span>Удвоение на 15 сек</span>
        <strong id="cost-boost">200</strong>
      </button>
      <p class="note">*Все улучшения сохраняются в памяти браузера (LocalStorage).*</p>
    </div>

    <div class="click-area">
      <div class="avatar-wrapper" id="tapper">
        <img src="photo.jpg" alt="Clicker Target" class="avatar-img">
      </div>

      <div class="score-display">
        <div class="score-title">ОЧКОВ: <span id="score-text">0</span></div>
        <div class="sub-score">МОНЕТ: <span id="coins-text">0</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Текущие достижения</div>
      <div class="stat-row">
        <span>Кликов в секунду (CPS):</span>
        <span id="cps-text">0</span>
      </div>
      <div class="stat-row">
        <span>Всего кликов:</span>
        <span id="total-clicks-text">0</span>
      </div>
      <div class="stat-row">
        <span>Сила клика:</span>
        <span id="power-text">1</span>
      </div>
      <p class="note">*База данных не используется. Прогресс закреплен за этим устройством.*</p>
    </div>
  </main>

  <script>

    const state = {

      totalClicks: Number(localStorage.getItem('tapper_totalClicks')) ||
