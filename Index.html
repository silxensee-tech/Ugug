<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iQOO Turbo Clicker</title>
  <style>
    :root {
      --bg: #0b0e17;
      --card-bg: rgba(23, 30, 46, 0.8);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #ff7700;
      --accent: #ffd000;
      --cyan: #00e5ff;
      --text: #f8fafc;
      --text-muted: #8c9ba5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #231c42 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px 12px;
      overflow-x: hidden;
    }

    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand-title {
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .score-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 5px;
    }

    .score-value {
      font-size: 3.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 25px rgba(255, 119, 0, 0.5);
    }

    .score-sub {
      display: flex;
      gap: 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .score-sub span {
      color: var(--cyan);
    }

    /* Тапалка без 3D-багов Safari */
    .tap-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: auto 0;
    }

    .tap-card {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.06s ease;
      background: #121622;
      box-shadow: 0 0 35px rgba(255, 119, 0, 0.35);
    }

    .tap-card.active {
      transform: scale(0.92);
    }

    .tap-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--primary), var(--accent), var(--cyan), var(--primary));
      animation: spin 7s linear infinite;
      z-index: 1;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar {
      width: 242px;
      height: 242px;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
      border: 4px solid var(--bg);
      background: #1a2030;
      pointer-events: none;
    }

    /* Надежная загрузка файлов для iOS */
    .file-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #file-input {
      display: none;
    }

    .float-num {
      position: fixed;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 15px var(--primary);
      pointer-events: none;
      z-index: 9999;
      animation: flyUp 0.7s ease-out forwards;
    }

    @keyframes flyUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -90px) scale(1.15); }
    }

    .stamina-wrapper {
      width: 100%;
      max-width: 440px;
      margin: 8px 0;
    }

    .stamina-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .stamina-bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .stamina-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      box-shadow: 0 0 8px var(--primary);
      transition: width 0.1s linear;
    }

    .upgrade-grid {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--text);
    }

    .btn-card:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .btn-val {
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--cyan);
    }

    .btn-price {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(255, 208, 0, 0.12);
      padding: 2px 7px;
      border-radius: 8px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-title">iQOO TURBO PRO</div>
    <button class="btn-reset" id="btn-reset">Сброс ↺</button>
  </div>

  <div class="score-container">
    <div class="score-value" id="score-text">0</div>
    <div class="score-sub">
      <div>СИЛА: <span id="power-text">1</span></div>
      <div>АВТО: <span id="cps-text">0</span>/сек</div>
      <div>ТАПОВ: <span id="total-text">0</span></div>
    </div>
  </div>

  <div class="tap-area">
    <div class="tap-card" id="tap-target">
      <div class="tap-ring"></div>
      <img src="photo.jpg" alt="Target" class="avatar" id="avatar-img" onerror="this.style.opacity='0.2';">
    </div>
    
    <button class="file-btn" id="trigger-upload">📷 Сменить фото</button>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div class="stamina-wrapper">
    <div class="stamina-header">
      <span>ЭНЕРГИЯ</span>
      <span><b id="energy-text" style="color:#fff;">1000</b> / <span id="max-energy-text">1000</span></span>
    </div>
    <div class="stamina-bar">
      <div class="stamina-fill" id="energy-bar"></div>
    </div>
  </div>

  <div class="upgrade-grid">
    <button class="btn-card" id="up-click">
      <div class="btn-name">Клик</div>
      <div class="btn-val">+1 Сила</div>
      <div class="btn-price" id="cost-click">20</div>
    </button>
    <button class="btn-card" id="up-auto">
      <div class="btn-name">Авто-тап</div>
      <div class="btn-val">+2 /сек</div>
      <div class="btn-price" id="cost-auto">80</div>
    </button>
    <button class="btn-card" id="up-energy">
      <div class="btn-name">Бак</div>
      <div class="btn-val">+500 Max</div>
      <div class="btn-price" id="cost-energy">100</div>
    </button>
  </div>

  <script>
    function safeNum(val, def) {
      const n = Number(val);
      return (!isNaN(n) && isFinite(n)) ? n : def;
    }

    const state = {
      score: safeNum(localStorage.getItem('iq_score'), 0),
      totalClicks: safeNum(localStorage.getItem('iq_total'), 0),
      clickPower: safeNum(localStorage.getItem('iq_power'), 1),
      autoRate: safeNum(localStorage.getItem('iq_auto'), 0),
      energy: safeNum(localStorage.getItem('iq_energy'), 1000),
      maxEnergy: safeNum(localStorage.getItem('iq_maxEnergy'), 1000),
      costClick: safeNum(localStorage.getItem('iq_costClick'), 20),
      costAuto: safeNum(localStorage.getItem('iq_costAuto'), 80),
      costEnergy: safeNum(localStorage.getItem('iq_costEnergy'), 100)
    };

    // Загрузка фото из памяти
    const avatarImg = document.getElementById('avatar-img');
    const savedPhoto = localStorage.getItem('iq_photo');
    if (savedPhoto) {
      avatarImg.src = savedPhoto;
      avatarImg.style.opacity = '1';
    }

    // Обработка загрузки фото с автоматическим сжатием
    const fileInput = document.getElementById('file-input');
    document.getElementById('trigger-upload').addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const tempImg = new Image();
        tempImg.onload = function() {
          // Сжатие до 400x400 для гарантии сохранения в iOS Safari
          const canvas = document.createElement('canvas');
          const maxDim = 400;
          let w = tempImg.width, h = tempImg.height;
          if (w > h) {
            if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          } else {
            if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(tempImg, 0, 0, w, h);

          const compressedData = canvas.toDataURL('image/jpeg', 0.85);
          avatarImg.src = compressedData;
          avatarImg.style.opacity = '1';

          try {
            localStorage.setItem('iq_photo', compressedData);
          } catch (err) {
            console.warn('Ошибка сохранения в LocalStorage:', err);
          }
        };
        tempImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function save() {
      try {
        localStorage.setItem('iq_score', Math.floor(state.score));
        localStorage.setItem('iq_total', state.totalClicks);
        localStorage.setItem('iq_power', state.clickPower);
        localStorage.setItem('iq_auto', state.autoRate);
        localStorage.setItem('iq_energy', Math.floor(state.energy));
        localStorage.setItem('iq_maxEnergy', state.maxEnergy);
        localStorage.setItem('iq_costClick', state.costClick);
        localStorage.setItem('iq_costAuto', state.costAuto);
        localStorage.setItem('iq_costEnergy', state.costEnergy);
      } catch (err) {}
    }

    function render() {
      document.getElementById('score-text').textContent = Math.floor(state.score).toLocaleString();
      document.getElementById('power-text').textContent = '+' + state.clickPower;
      document.getElementById('cps-text').textContent = state.autoRate;
      document.getElementById('total-text').textContent = state.totalClicks.toLocaleString();

      const eFloor = Math.floor(state.energy);
      document.getElementById('energy-text').textContent = eFloor;
      document.getElementById('max-energy-text').textContent = state.maxEnergy;
      document.getElementById('energy-bar').style.width = ((eFloor / state.maxEnergy) * 100) + '%';

      document.getElementById('cost-click').textContent = state.costClick;
      document.getElementById('cost-auto').textContent = state.costAuto;
      document.getElementById('cost-energy').textContent = state.costEnergy;

      document.getElementById('up-click').disabled = state.score < state.costClick;
      document.getElementById('up-auto').disabled = state.score < state.costAuto;
      document.getElementById('up-energy').disabled = state.score < state.costEnergy;
    }

    function createFloatNum(x, y, val) {
      const el = document.createElement('div');
      el.className = 'float-num';
      el.textContent = '+' + val;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    // Обработка нажатий на iOS
    const target = document.getElementById('tap-target');

    function handleTap(clientX, clientY) {
      // Всегда даёт тапнуть минимум на 1, даже если энергия на нуле
      const cost = Math.min(state.energy, state.clickPower);
      const points = cost > 0 ? state.clickPower : 1;

      state.score += points;
      state.energy = Math.max(0, state.energy - points);
      state.totalClicks++;

      createFloatNum(clientX, clientY, points);

      target.classList.add('active');
      setTimeout(() => target.classList.remove('active'), 60);

      render();
    }

    // Сенсорные события для iOS
    target.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        handleTap(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    // Клик мышью для ПК
    target.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    // Магазин
    document.getElementById('up-click').addEventListener('click', () => {
      if (state.score >= state.costClick) {
        state.score -= state.costClick;
        state.clickPower += 1;
        state.costClick = Math.floor(state.costClick * 1.5);
        render();
        save();
      }
    });

    document.getElementById('up-auto').addEventListener('click', () => {
      if (state.score >= state.costAuto) {
        state.score -= state.costAuto;
        state.autoRate += 2;
        state.costAuto = Math.floor(state.costAuto * 1.6);
        render();
        save();
      }
    });

    document.getElementById('up-energy').addEventListener('click', () => {
      if (state.score >= state.costEnergy) {
        state.score -= state.costEnergy;
        state.maxEnergy += 500;
        state.energy += 500;
        state.costEnergy = Math.floor(state.costEnergy * 1.7);
        render();
        save();
      }
    });

    // Сброс при необходимости
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('Сбросить весь накопленный прогресс?')) {
        localStorage.clear();
        location.reload();
      }
    });

    // Авто-фарм и регенерация энергии
    setInterval(() => {
      let updated = false;
      if (state.autoRate > 0) {
        state.score += state.autoRate / 10;
        updated = true;
      }
      if (state.energy < state.maxEnergy) {
        state.energy = Math.min(state.maxEnergy, state.energy + 0.5);
        updated = true;
      }
      if (updated) render();
    }, 100);

    setInterval(save, 3000);
    render();
  </script>
</body>
</html>
