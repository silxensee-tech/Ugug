<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iQOO Turbo Clicker</title>
  <style>
    :root {
      --bg: #090c13;
      --card-bg: rgba(22, 28, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #ff7700;
      --primary-glow: #ff770066;
      --accent: #ffd000;
      --cyan: #00e5ff;
      --text-main: #f8fafc;
      --text-muted: #8492a6;
      --green: #00ff88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1c1938 0%, var(--bg) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 18px 12px;
    }

    /* Верхняя панель инфо */
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand-title {
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rank-badge {
      background: linear-gradient(135deg, rgba(255, 119, 0, 0.2), rgba(255, 208, 0, 0.2));
      border: 1px solid rgba(255, 119, 0, 0.4);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    /* Главный счётчик */
    .score-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0 5px;
    }

    .score-value {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 35px rgba(255, 153, 0, 0.45);
    }

    .score-sub {
      display: flex;
      gap: 15px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .score-sub span {
      color: var(--cyan);
    }

    /* 3D-Тапалка */
    .tap-area {
      perspective: 1000px;
      margin: auto 0;
      position: relative;
    }

    .tap-card {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease-out;
      transform-style: preserve-3d;
    }

    .tap-card::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--primary), var(--accent), var(--cyan), var(--primary));
      animation: rotateRing 8s linear infinite;
      z-index: 1;
      filter: blur(12px);
      opacity: 0.7;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .tap-inner-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      z-index: 2;
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      z-index: 3;
      border: 4px solid #090c13;
      pointer-events: none;
      background: #181d2a;
    }

    /* Всплывающие цифры */
    .float-num {
      position: fixed;
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px var(--primary), 0 0 24px var(--accent);
      pointer-events: none;
      z-index: 999;
      animation: flyUp 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
    }

    @keyframes flyUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); }
      50% { transform: translate(-50%, -60px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -110px) scale(0.8); }
    }

    /* Статус энергии */
    .stamina-wrapper {
      width: 100%;
      max-width: 480px;
      margin: 15px 0 10px;
    }

    .stamina-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stamina-bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .stamina-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      box-shadow: 0 0 10px var(--primary);
      transition: width 0.15s ease;
    }

    /* Блок апгрейдов */
    .upgrade-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-main);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .btn-card:active {
      transform: scale(0.96);
    }

    .btn-card:hover:not(:disabled) {
      border-color: rgba(255, 119, 0, 0.5);
      background: rgba(30, 38, 58, 0.9);
    }

    .btn-card:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }

    .btn-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    .btn-val {
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--cyan);
    }

    .btn-price {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(255, 208, 0, 0.12);
      padding: 2px 8px;
      border-radius: 8px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-title">iQOO Z10 PRO</div>
    <div class="rank-badge" id="rank-text">Bronze I</div>
  </div>

  <div class="score-container">
    <div class="score-value">
      <span id="score-text">0</span>
    </div>
    <div class="score-sub">
      <div>СИЛА: <span id="power-text">1</span></div>
      <div>АВТО: <span id="cps-text">0</span>/сек</div>
      <div>ТАПОВ: <span id="total-text">0</span></div>
    </div>
  </div>

  <div class="tap-area">
